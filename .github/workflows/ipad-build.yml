name: ChordPilot – build all platforms & installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  ipad:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Unit tests (music theory engine)
        working-directory: ChordPilot/Packages/ChordPilotCore
        run: swift test
      - name: Generate Xcode project
        working-directory: ChordPilot
        run: brew install xcodegen && xcodegen generate
      - name: Build iPad app + AUv3 plug-in (unsigned)
        working-directory: ChordPilot
        run: |
          set -o pipefail
          xcodebuild -project ChordPilot.xcodeproj -scheme ChordPilot -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 80
      - name: Package .ipa
        run: |
          APP=ChordPilot/build/Build/Products/Release-iphoneos/ChordPilot.app
          test -d "$APP/PlugIns/ChordPilotAU.appex"
          mkdir -p out Payload && cp -R "$APP" Payload/
          zip -qry out/ChordPilot-iPad-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ipad, path: out }

  desktop-mac:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build VST3 + AU + Standalone (universal)
        working-directory: Desktop
        run: |
          cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          cmake --build build --config Release --target ChordPilot_VST3 ChordPilot_AU ChordPilot_Standalone ChordPilotEngineTests -- -quiet
          ./build/Release/ChordPilotEngineTests
      - name: Installer .pkg
        run: Desktop/Installer/make-mac-pkg.sh Desktop/build/ChordPilot_artefacts/Release out
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: out }

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build VST3 + Standalone
        working-directory: Desktop
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --target ChordPilot_VST3 ChordPilot_Standalone ChordPilotEngineTests
          .\build\Release\ChordPilotEngineTests.exe
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DSrcDir="$pwd\Desktop\build\ChordPilot_artefacts\Release" /O"$pwd\out" Desktop\Installer\ChordPilot-Windows.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out }

  installer:
    needs: [ipad, desktop-mac, desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artefacts }
      - name: Assemble ChordPilot-Installer
        run: |
          set -e
          DIST=dist/ChordPilot-Installer
          mkdir -p "$DIST"
          cp -R Installer/. "$DIST/"
          cp artefacts/ipad/* "$DIST/iPad/"
          cp WebApp/ChordPilot.html "$DIST/iPad/"
          cp artefacts/mac/* "$DIST/Mac/"
          cp artefacts/windows/* "$DIST/Windows/"
          git archive --format=zip --prefix=ChordPilot-source/ -o "$DIST/iPad/ChordPilot-source.zip" HEAD
          (cd dist && zip -qry ChordPilot-Installer.zip ChordPilot-Installer)
      - uses: actions/upload-artifact@v4
        with: { name: ChordPilot-Installer, path: dist/ChordPilot-Installer.zip }
      - name: Publish release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: dist/ChordPilot-Installer.zip }
