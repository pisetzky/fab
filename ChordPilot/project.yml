# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: ChordPilot
options:
  bundleIdPrefix: com.fabaudio
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: it
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"          # iPad (also runs on Apple-silicon Macs as "Designed for iPad")
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
    SWIFT_OBJC_BRIDGING_HEADER: Shared/DSP/ChordPilot-Bridging-Header.h
    DEVELOPMENT_TEAM: ""                 # put your Apple Team ID here (or choose it in Xcode)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  ChordPilotCore:
    path: Packages/ChordPilotCore

targets:
  ChordPilot:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: ChordPilotCore
      - target: ChordPilotAU
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabaudio.chordpilot
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: ChordPilot

  ChordPilotAU:
    type: app-extension
    platform: iOS
    sources:
      - path: AUExtension
      - path: Shared
    dependencies:
      - package: ChordPilotCore
      - sdk: CoreAudioKit.framework
      - sdk: AudioToolbox.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabaudio.chordpilot.auv3
        INFOPLIST_FILE: AUExtension/Info.plist
        PRODUCT_NAME: ChordPilotAU
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  ChordPilot:
    build:
      targets:
        ChordPilot: all
        ChordPilotAU: all
    run:
      config: Debug
    archive:
      config: Release
